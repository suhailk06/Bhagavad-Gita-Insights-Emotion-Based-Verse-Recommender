{% extends "base.html" %}

{% block content %}
<div class="page">
  <div class="container">
    <h1>Bhagavad Gita Insights</h1>
    <p class="subtitle">Welcome to the Bhagavad Gita Insights API!</p>

    <form action="/" method="post" class="feeling-form">
      <label for="content">Enter Your Feelings</label>
      <input
        type="text"
        id="content"
        name="content"
        placeholder="e.g. I feel anxious about the future…"
        autocomplete="off"
        required
      >
      <button type="submit">Enter</button>
    </form>

    {% if content %}
      <p class="result">You entered: <strong>{{ content }}</strong></p>
    {% endif %}
  </div>
</div>

<style>

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

  }

  .page {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 40px 36px;
    text-align: center;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 20px;


  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(40deg, #060606, #d97706);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 0;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .feeling-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 28px;
    text-align: left;
  }

  label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input[type="text"]::placeholder {
    color: #9ca3af;
  }


  button {
    padding: 14px 20px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background-color: black;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(234, 88, 12, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(234, 88, 12, 0.35);
    filter: brightness(1.05);
  }

  button:active {
    transform: translateY(0);
    box-shadow: 0 6px 14px rgba(234, 88, 12, 0.3);
  }

</style>
{% endblock %}
